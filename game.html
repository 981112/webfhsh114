<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小白球 - 眼力挑戰版</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #e6f1ff;
            --paddle-color: linear-gradient(90deg, #ff0055 0%, #ff4d4d 100%);
            --neon-red: #ff0055;
            --neon-green: #00ff99;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            cursor: default;
        }

        body.game-playing {
            cursor: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 80vh;
            border: 2px solid #330011;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.15);
            background: #000000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .settings {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #330011;
            text-align: center;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }

        .settings.locked {
            opacity: 0.5;
            pointer-events: none;
        }

        .score-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
        }

        .color-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .color-dot.active {
            border-color: #fff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        #menu, #game-over, #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(15, 0, 5, 0.98);
            padding: 3rem;
            border-radius: 20px;
            border: 2px solid var(--neon-red);
            width: 70%;
            display: none;
            z-index: 10;
        }

        #win-screen {
            border-color: var(--neon-green);
        }

        #menu { display: block; }

        .btn-main {
            background: var(--paddle-color);
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
            font-weight: bold;
        }

        .btn-win {
            background: linear-gradient(90deg, #00ff99 0%, #00ccff 100%);
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-panel">
            <div class="stats">
                <div class="score-text">分數: <span id="currentScore">0</span> / 20</div>
                <div class="score-text">最高紀錄: <span id="highScore">0</span></div>
            </div>
            <div class="settings" id="settingsPanel">
                <div style="font-size: 0.8rem; margin-bottom: 5px; color: #0ed68a; font-weight: bold;">球的顏色</div>
                <div class="color-options" id="colorOptions">
                    <div class="color-dot active" style="background: #ffffff;" data-color="#ffffff"></div>
                    <div class="color-dot" style="background: #ff0000;" data-color="#ff0000"></div>
                    <div class="color-dot" style="background: #ff7f00;" data-color="#ff7f00"></div>
                    <div class="color-dot" style="background: #ffff00;" data-color="#ffff00"></div>
                    <div class="color-dot" style="background: #00ff00;" data-color="#00ff00"></div>
                    <div class="color-dot" style="background: #0000ff;" data-color="#0000ff"></div>
                    <div class="color-dot" style="background: #4b0082;" data-color="#4b0082"></div>
                    <div class="color-dot" style="background: #9400d3;" data-color="#9400d3"></div>
                </div>
            </div>
        </div>

        <div id="menu">
            <h1 style="color: #ff0055; font-size: 2.5rem; margin-bottom: 10px;">小白球-光速版</h1>
            <p>目標：達到 20 分即可獲勝！ (鼠標控制下方橫桿擊球)</p>
            <button class="btn-main" onclick="startGame()">開始挑戰</button>
        </div>

        <div id="game-over">
            <h1 style="color: #ff4d4d;">挑戰失敗</h1>
            <p style="font-size: 1.5rem;">最終得分: <span id="finalScore">0</span></p>
            <button class="btn-main" onclick="startGame()">再試一次</button>
        </div>

        <div id="win-screen">
            <h1 style="color: #00ff99; font-size: 2.5rem;">恭喜獲勝！</h1>
            <p style="font-size: 1.2rem;">你成功達到了 20 分目標！</p>
            <button class="btn-main btn-win" onclick="startGame()">重新挑戰</button>
        </div>
    </div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const menu = document.getElementById('menu');
    const gameOverMenu = document.getElementById('game-over');
    const winScreen = document.getElementById('win-screen');
    const settingsPanel = document.getElementById('settingsPanel');
    const body = document.body;
    const colorDots = document.querySelectorAll('.color-dot');

    let score = 0;
    // 【修改點 1】直接設為 0，不再從 localStorage 讀取
    let highScore = 0; 
    let gameActive = false;
    let animationId;
    let selectedBallColor = "#ffffff";

    colorDots.forEach(dot => {
        dot.addEventListener('click', () => {
            if (gameActive) return;
            colorDots.forEach(d => d.classList.remove('active'));
            dot.classList.add('active');
            selectedBallColor = dot.getAttribute('data-color');
        });
    });

    const paddle = {
        width: 120,
        height: 15,
        x: 0,
        y: 0
    };

    const ball = {
        x: 0,
        y: 0,
        radius: 18,
        speedX: 0,
        speedY: 0,
        maxSpeed: 18 
    };

    function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        paddle.y = canvas.height - 50;
        if (!gameActive) {
            paddle.x = (canvas.width - paddle.width) / 2;
        }
    }

    window.addEventListener('resize', resize);
    resize();

    canvas.addEventListener('mousemove', (e) => {
        if (!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        paddle.x = mouseX - paddle.width / 2;
        if (paddle.x < 0) paddle.x = 0;
        if (paddle.x > canvas.width - paddle.width) paddle.x = canvas.width - paddle.width;
    });

    function initBall() {
        ball.x = Math.random() * (canvas.width - ball.radius * 2) + ball.radius;
        ball.y = 100;
        const getRandomSpeed = () => Math.random() * (7 - 5) + 5;
        ball.speedX = getRandomSpeed() * (Math.random() > 0.5 ? 1 : -1);
        ball.speedY = getRandomSpeed();
    }

    function startGame() {
        score = 0;
        // 【修改點 2】每次開始不需要重新讀取，直接顯示目前的 highScore 變數
        scoreEl.innerText = score;
        highScoreEl.innerText = highScore;
        gameActive = true;
        menu.style.display = 'none';
        gameOverMenu.style.display = 'none';
        winScreen.style.display = 'none';
        body.classList.add('game-playing');
        settingsPanel.classList.add('locked');
        initBall();
        resize();
        gameLoop();
    }

    function gameOver() {
        gameActive = false;
        cancelAnimationFrame(animationId);
        body.classList.remove('game-playing');
        settingsPanel.classList.remove('locked');
        if (score > highScore) {
            highScore = score;
            // 【修改點 3】移除 localStorage.setItem，只更新變數
        }
        finalScoreEl.innerText = score;
        highScoreEl.innerText = highScore; // 確保畫面上同步更新
        gameOverMenu.style.display = 'block';
    }

    function gameWin() {
        gameActive = false;
        cancelAnimationFrame(animationId);
        body.classList.remove('game-playing');
        settingsPanel.classList.remove('locked');
        if (score > highScore) {
            highScore = score;
            // 【修改點 4】移除 localStorage.setItem，只更新變數
        }
        highScoreEl.innerText = highScore; // 確保畫面上同步更新
        winScreen.style.display = 'block';
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 4;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff0055';
        ctx.strokeRect(2, 2, canvas.width - 4, canvas.height + 10);
        
        ctx.beginPath();
        const grad = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.width, 0);
        grad.addColorStop(0, '#ff0055');
        grad.addColorStop(1, '#ff4d4d');
        ctx.fillStyle = grad;
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = selectedBallColor;
        ctx.fill();
        ctx.closePath();
    }

    function update() {
        if (!gameActive) return;

        ball.x += ball.speedX;
        ball.y += ball.speedY;

        if (ball.x + ball.radius >= canvas.width - 2 || ball.x - ball.radius <= 2) {
            ball.speedX *= -1;
            ball.x = ball.x - ball.radius <= 2 ? ball.radius + 3 : canvas.width - ball.radius - 3;
        }
        if (ball.y - ball.radius <= 2) {
            ball.speedY *= -1;
            ball.y = ball.radius + 3;
        }

        if (
            ball.y + ball.radius >= paddle.y && 
            ball.y - ball.radius <= paddle.y + paddle.height &&
            ball.x >= paddle.x && 
            ball.x <= paddle.x + paddle.width &&
            ball.speedY > 0
        ) {
            ball.speedY *= -1;
            score++;
            scoreEl.innerText = score;

            if (score >= 20) {
                gameWin();
                return;
            }

            if (Math.abs(ball.speedY) < ball.maxSpeed) {
                ball.speedY *= 1.05;
                ball.speedX *= 1.05;
            }
        }

        if (ball.y - ball.radius > canvas.height) {
            gameOver();
        }
    }

    function gameLoop() {
        if (!gameActive) return;
        update();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    highScoreEl.innerText = highScore;
</script>
</body>
</html>
