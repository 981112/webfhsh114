<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小白球 </title>
    <style>
        body {
            margin: 0;
            background-color: #222; /* 深灰色背景 */
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column; /* 由上往下排列 */
            align-items: center;
            justify-content: center;
            height: 100vh; /* 滿版高度 */
        }

        /*分數板 */
        .score-board {
            font-size: 24px;
            margin-bottom: 10px;
        }

        /*加上白色邊框 */
        canvas {
            background-color: #000; /* 畫布是黑的 */
            border: 2px solid white; /* 白框 */
            display: block;
            cursor: none; /* 移入畫布時隱藏滑鼠 */
        }

        /*按鈕樣式 */
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        
        button:hover {
            background-color: #45a049;
        }

        /* 隱藏鼠標用 */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="score-board">
        分數: <span id="score">0</span> / 20
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <h2 id="msg">按下按鈕開始遊戲</h2>
    <button id="startBtn" onclick="startGame()">開始遊戲</button>

    <script>
        // --- 1. 變數設定 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d'); // 取得畫筆
        const scoreEl = document.getElementById('score');
        const msgEl = document.getElementById('msg');
        const startBtn = document.getElementById('startBtn');

        let score = 0;
        let isGameRunning = false;
        let animationId; // 用來控制動畫暫停


        const paddle = {
            width: 100,
            height: 10,
            x: 250, // 初始位置 (置中)
            y: 380, // 固定在底部
            color: '#0095DD' // 藍色
        };

        const ball = {
            x: 300,
            y: 200,
            radius: 10,
            speedX: 4, // 固定水平速度
            speedY: 4, // 固定垂直速度
            color: '#FFFFFF' // 白色
        };

        // --- 2. 監聽滑鼠移動 --
        canvas.addEventListener('mousemove', function(e) {
            // 計算滑鼠在畫布內的 X 位置
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;

            // 讓擋板中心對準滑鼠
            paddle.x = mouseX - paddle.width / 2;

            // 防止擋板跑出畫布左右邊界
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x > canvas.width - paddle.width) paddle.x = canvas.width - paddle.width;
        });

        function startGame() {
            // 重置分數與狀態
            score = 0;
            scoreEl.innerText = score;
            isGameRunning = true;
            
            // 隱藏按鈕與訊息
            startBtn.classList.add('hidden');
            msgEl.innerText = "";

            // 重置球的位置
            ball.x = canvas.width / 2;
            ball.y = 50;
            ball.speedY = 4; // 確保球是往下掉
            ball.speedX = 4 * (Math.random() > 0.5 ? 1 : -1); // 隨機往左或往右

            // 動畫迴圈
            gameLoop();
        }

        function stopGame(message) {
            isGameRunning = false;
            cancelAnimationFrame(animationId); // 停止動畫
            msgEl.innerText = message;
            startBtn.classList.remove('hidden'); // 顯示按鈕
        }
        function draw() {
            // 清除畫布避免有殘影
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            
            ctx.fillStyle = paddle.color;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.closePath();
        }
        function update() {
            // 移動球
            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // 碰到左右牆壁 -> 反彈
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.speedX = -ball.speedX;
            }

            // 碰到頂部 -> 反彈
            if (ball.y - ball.radius < 0) {
                ball.speedY = -ball.speedY;
            }

            // 碰到擋板偵測
            if (
                ball.y + ball.radius >= paddle.y && // 球碰到底部高度
                ball.x >= paddle.x &&               // 球在擋板左邊界以右
                ball.x <= paddle.x + paddle.width   // 球在擋板右邊界以左
            ) {
                ball.speedY = -ball.speedY; // 垂直反彈
                score++;
                scoreEl.innerText = score;

                
                if (score >= 20) {
                    stopGame("恭喜獲勝！你達到20分了！");
                }
            }

            
            if (ball.y - ball.radius > canvas.height) {
                stopGame("遊戲結束！最終分數: " + score);
            }
        }

        //  遊戲迴圈 (Loop) ---
        function gameLoop() {
            if (!isGameRunning) return;

            update(); // 算位置
            draw();   // 畫畫面
            
            // 請求下一幀動畫 (約每秒60次)
            animationId = requestAnimationFrame(gameLoop);
        }

    </script>
</body>
</html>
